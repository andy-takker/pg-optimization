groups:
- name: host
  rules:
  - alert: DiskSpaceLow
    expr: (1 - node_filesystem_avail_bytes{mountpoint="/mnt/demo"} / node_filesystem_size_bytes{mountpoint="/mnt/demo"}) * 100 > 80
    for: 30s
    labels: { severity: critical }
    annotations: { summary: "Диск {{$labels.mountpoint}} занят более 80%" }
  - alert: MemoryHigh
    expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 85
    for: 1m
    labels: { severity: warning }
    annotations: { summary: "Память занята более 85%" }
- name: postgres
  rules:
  - alert: TooManyConnections
    expr: sum(pg_stat_activity_count) > 150
    for: 30s
    labels: { severity: warning }
    annotations: { summary: "Слишком много соединений к PostgreSQL" }
